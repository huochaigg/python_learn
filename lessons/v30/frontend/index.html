<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V30 Agent SSE</title>
    <style>
      body { font-family: sans-serif; max-width: 720px; margin: 24px auto; }
      textarea { width: 100%; min-height: 72px; }
      button { margin-right: 8px; }
      #answer, #tools { white-space: pre-wrap; border: 1px solid #ccc; padding: 12px; min-height: 48px; }
      .label { font-weight: bold; margin-top: 16px; }
    </style>
  </head>
  <body>
    <h1>V30 Streaming Agent</h1>
    <textarea id="message">SKU002 还有多少库存？</textarea>
    <p>
      <button id="send" type="button">发送</button>
      <button id="stop" type="button">停止</button>
    </p>
    <div class="label">Tool 状态</div>
    <div id="tools"></div>
    <div class="label">消息</div>
    <div id="answer"></div>
    <script>
      const messageEl = document.getElementById("message");
      const answerEl = document.getElementById("answer");
      const toolsEl = document.getElementById("tools");
      const sendBtn = document.getElementById("send");
      const stopBtn = document.getElementById("stop");
      let controller = null;

      function appendTool(text) {
        toolsEl.textContent += text + "\n";
      }

      function parseFrame(frame) {
        let eventName = "message";
        const dataLines = [];
        for (const raw of frame.split(/\r?\n/)) {
          if (raw.startsWith("event:")) eventName = raw.slice(6).trim();
          else if (raw.startsWith("data:")) dataLines.push(raw.slice(5).trimStart());
        }
        return { eventName, dataText: dataLines.join("\n") };
      }

      function consumeBuffer(buffer) {
        const events = [];
        while (true) {
          const idxLf = buffer.indexOf("\n\n");
          const idxCr = buffer.indexOf("\r\n\r\n");
          let idx = -1;
          let sep = 2;
          if (idxLf >= 0 && (idxCr < 0 || idxLf <= idxCr)) {
            idx = idxLf;
            sep = 2;
          } else if (idxCr >= 0) {
            idx = idxCr;
            sep = 4;
          }
          if (idx < 0) break;
          events.push(parseFrame(buffer.slice(0, idx)));
          buffer = buffer.slice(idx + sep);
        }
        return { events, buffer };
      }

      async function sendMessage() {
        if (controller) controller.abort();
        controller = new AbortController();
        answerEl.textContent = "";
        toolsEl.textContent = "";
        let buffer = "";
        const decoder = new TextDecoder();
        try {
          const response = await fetch("/agent/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: messageEl.value }),
            signal: controller.signal,
          });
          if (!response.ok || !response.body) {
            answerEl.textContent = "HTTP " + response.status;
            return;
          }
          const reader = response.body.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) {
              buffer += decoder.decode();
              break;
            }
            buffer += decoder.decode(value, { stream: true });
            const split = consumeBuffer(buffer);
            buffer = split.buffer;
            for (const evt of split.events) handleEvent(evt);
          }
          const tail = consumeBuffer(buffer);
          for (const evt of tail.events) handleEvent(evt);
        } catch (err) {
          if (err && err.name === "AbortError") {
            appendTool("stopped");
            return;
          }
          answerEl.textContent = "request failed";
        } finally {
          controller = null;
        }
      }

      function handleEvent(evt) {
        let payload = {};
        if (evt.dataText) {
          try {
            payload = JSON.parse(evt.dataText);
          } catch {
            return;
          }
        }
        if (evt.eventName === "start") {
          appendTool("start " + (payload.request_id || ""));
        } else if (evt.eventName === "delta") {
          answerEl.textContent += payload.content || "";
        } else if (evt.eventName === "tool_call") {
          appendTool("tool_call " + (payload.name || ""));
        } else if (evt.eventName === "tool_result") {
          appendTool("tool_result " + (payload.result || ""));
        } else if (evt.eventName === "done") {
          appendTool("done");
        } else if (evt.eventName === "error") {
          appendTool("error " + (payload.message || ""));
        }
      }

      function stopMessage() {
        if (controller) controller.abort();
      }

      sendBtn.addEventListener("click", sendMessage);
      stopBtn.addEventListener("click", stopMessage);
    </script>
  </body>
</html>
